<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Vercel로 배포하기 위한 간단한 개인 소개 페이지입니다."
    />
    <title>소개 페이지</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro" aria-labelledby="intro-title">
        <div class="profile-mark" aria-hidden="true">H</div>

        <div class="intro-copy">
          <p class="eyebrow">Personal Introduction</p>
          <h1 id="intro-title">안녕하세요, hororong입니다.</h1>
          <p class="summary">
            웹에 올릴 수 있는 간단한 소개 페이지입니다. 이름, 소개 문구,
            연락처만 바꾸면 바로 개인 프로필이나 포트폴리오 첫 화면으로 사용할
            수 있습니다.
          </p>

          <div class="actions" aria-label="주요 링크">
            <a class="button primary" href="mailto:hello@example.com">메일 보내기</a>
            <a class="button secondary" href="https://github.com/" target="_blank" rel="noreferrer">
              GitHub
            </a>
          </div>
        </div>
      </section>

      <section class="details" aria-label="소개 상세">
        <article>
          <h2>관심 분야</h2>
          <p>웹 서비스, 자동화, 사용하기 쉬운 인터페이스를 만드는 일에 관심이 있습니다.</p>
        </article>
        <article>
          <h2>현재 하는 일</h2>
          <p>아이디어를 빠르게 실험하고, 배포 가능한 형태로 정리하는 작업을 진행합니다.</p>
        </article>
        <article>
          <h2>연락</h2>
          <p>hello@example.com 주소를 실제 이메일로 바꿔서 사용하세요.</p>
        </article>
      </section>
    </main>
  </body>
</html>
